name: Publicar versión

# Cada vez que cambia la versión de package.json en main se compila el instalador
# y se publica como release vX.Y.Z. Si esa versión ya está publicada, no hace nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si la versión ya está publicada
        id: check
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $v ya está publicada."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        if: steps.check.outputs.publish == 'true'
        run: npm ci
      - name: Compilar y publicar el instalador
        if: steps.check.outputs.publish == 'true'
        run: npx electron-builder --win nsis --publish always
